# Run the same four checks as the challenge's hand-in instructions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Format, generate, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze (include Riverpod plugin diagnostics)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test
